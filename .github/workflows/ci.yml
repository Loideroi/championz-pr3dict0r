name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: nothing in this workflow writes to the repo or uses
# secrets (added 2026-08-27 with the gate wiring; reviewer finding).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Node 24 bundles npm 11, matching local dev, so the lockfile npm 11
      # wrote installs as-is. (Node 22 bundles npm 10, which refuses it; until
      # 2026-09-13 this job worked around that with an unpinned
      # `npm install -g npm@11` — a networked global install that ran BEFORE
      # the supply-chain guard below. Removed; the version assertion is next.)
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Toolchain (assert bundled npm 11)
        run: |
          node --version
          npm --version
          npm --version | grep -q '^11\.' || { echo "expected the npm 11 bundled with Node 24"; exit 1; }
      - name: Lockfile integrity (lockfile-lint)
        # Runs BEFORE npm ci on purpose: a poisoned lockfile must be rejected
        # before anything installs or executes. npx fetches lockfile-lint
        # independently of the lockfile under test. No package-name aliases
        # exist in this lockfile (verified 2026-08-27) — if one ever appears,
        # verify it is legitimate before allowlisting it here.
        run: |
          npx --yes lockfile-lint@5.0.0 --path package-lock.json --type npm \
            --allowed-hosts npm --validate-https \
            --validate-integrity --validate-package-names
      - run: npm ci --no-audit --no-fund

      # Process judges (LLM Wiki, adopted 2026-09-11; byte-identical copies of the
      # wiki's tools/ at commit 947355e). Each runs its self-test first so a judge
      # that can no longer go red fails the build itself.
      - name: Instruction-file hygiene (self-test, then AGENTS.md)
        run: |
          node scripts/check-agents-md.mjs --self-test
          node scripts/check-agents-md.mjs AGENTS.md
      - name: Review-log contract (self-test, then docs/REVIEW_LOG.md)
        run: |
          node scripts/lint-review-log.mjs --self-test
          node scripts/lint-review-log.mjs docs/REVIEW_LOG.md
      - name: Lint (blocking budgets, zero warnings, time-bounded exceptions)
        run: npm run lint
        # Added 2026-08-27; BLOCKING since 2026-09-11: eslint runs with
        # --max-warnings 0, the complexity/max-lines budgets are errors, and
        # scripts/check-lint-exceptions.mjs fails on any eslint-disable that
        # lacks an expiry or is past it (exceptions listed in docs/REVIEW_TIERS.md).
      - name: Architecture rules (dependency-cruiser)
        run: npm run arch
        # Layering app → components → hooks → foundation (lib/i18n/content),
        # no cycles, no orphans outside framework entry files, no runtime
        # imports of devDependencies. Rules: .dependency-cruiser.js.
      - name: Dead code (knip — files, dependencies, unlisted imports)
        run: npm run deadcode:ci
        # High-signal categories only; unused exports/types are informational
        # (`npm run deadcode`), same policy as Fanbet. Config: knip.jsonc.
      - name: i18n parity (key + non-translatable-token check)
        run: npm run check:i18n
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Code duplication (jscpd)
        run: npm run dup
        # Ratchet gate: fails above 1% duplicated lines (threshold tightened
        # 2% → 1% on 2026-09-11 at a measured 0.86% / 9 exact clones, tests
        # excluded — docs/REVIEW_TIERS.md). Tighten as clones are
        # consolidated; never raise it.
      - name: Build
        run: npm run build

  relayer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck + test (skips until the relayer package exists)
        working-directory: relayer
        run: |
          if [ -f package.json ]; then
            # Lockfile integrity before install — same rule as the app job.
            npx --yes lockfile-lint@5.0.0 --path package-lock.json --type npm \
              --allowed-hosts npm --validate-https \
              --validate-integrity --validate-package-names
            npm ci --no-audit --no-fund
            npm run typecheck
            npm test
            npm run build
          else
            echo "relayer workspace not initialized yet — skipping"
          fi

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile + test
        working-directory: contracts
        run: |
          # Lockfile integrity before install — same rule as the app job.
          npx --yes lockfile-lint@5.0.0 --path package-lock.json --type npm \
            --allowed-hosts npm --validate-https \
            --validate-integrity --validate-package-names
          npm ci --no-audit --no-fund
          npx hardhat compile
          npx hardhat test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install slither (hash-pinned requirements)
        # Every package — slither-analyzer 0.11.4 (the version recorded in
        # SECURITY_FINDINGS.md) and its 48 transitive dependencies — is pinned
        # by exact version AND sha256 in contracts/requirements-slither.txt
        # (pip-compile --generate-hashes; refresh procedure in
        # docs/REVIEW_TIERS.md). --require-hashes makes pip refuse any
        # artifact whose hash is absent or differs; --only-binary=:all: refuses
        # sdists, so no isolated build environment can pull unpinned build
        # dependencies (every locked package ships a manylinux wheel, verified
        # 2026-09-13). Not hashed: the interpreter (setup-python 3.11.x) and
        # pip itself — recorded as the residual boundary in REVIEW_TIERS.
        run: >-
          python -m pip install --quiet --require-hashes --only-binary=:all:
          -r contracts/requirements-slither.txt
      - name: Static analysis (slither, blocking on new or stale High/Medium findings)
        working-directory: contracts
        # Same command as local: scripts/check-slither.mjs --run does
        # `hardhat compile --force` (pinned solc 0.8.24 / shanghai; a full
        # compile so artifacts always match the source), then slither on those
        # artifacts (--hardhat-ignore-compile — no `hardhat clean --global`)
        # writing to a fresh temp report so no earlier report can satisfy the
        # run; it fails on any
        # High/Medium finding not triaged in slither-triage.json, on any triage
        # entry whose id or metadata no longer matches a current finding, on a
        # malformed entry, and on a slither/compile failure (slither.log tail
        # printed). Its own tests run first. Added 2026-09-12 (PR C).
        run: npm run test:gate && npm run slither

  migrations:
    name: Migrations — squawk (changed files only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Changed files only: the historical migration is already applied in
    # production and carries 25 warning-level findings (docs/REVIEW_TIERS.md
    # baseline) — retro-gating it would be noise. Runs on pull requests (the
    # merge gate — it is a required check) AND on pushes to main since
    # 2026-09-11, diffing against the previous main head, so no path to main
    # skips it.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint changed migration files (squawk)
        # squawk exits non-zero on ANY finding, warnings included (verified
        # 2026-08-27) — so a new migration must be squawk-clean to merge.
        # A finding that is deliberate gets a commented, justified exclusion
        # in .squawk.toml in the same PR (that file is Tier 3 per
        # docs/REVIEW_TIERS.md) — the known-debt expiring-exception pattern.
        #
        # Selector notes: --no-renames makes a renamed migration show as an
        # Add (a renamed file IS a new migration to the Supabase CLI);
        # NUL-delimited xargs survives unusual filenames; BASE_SHA comes in
        # via env, not script interpolation (actions hardening guidance);
        # sha...HEAD gives merge-base semantics (fetch-depth 0 above).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to diff against (branch creation event) — nothing to lint"; exit 0
          fi
          echo "Changed migration files (if any):"
          git diff --name-only --no-renames --diff-filter=AM "$BASE_SHA...HEAD" -- 'supabase/migrations/*.sql'
          git diff --name-only -z --no-renames --diff-filter=AM "$BASE_SHA...HEAD" -- 'supabase/migrations/*.sql' \
            | xargs -0 -r npx --yes squawk-cli@2.63.0
