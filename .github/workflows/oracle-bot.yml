name: oracle-bot

on:
  schedule:
    # matchday window (UEFA kickoffs 16:45–21:00 UTC): every 5 min
    - cron: "*/5 16-23 * * *"
    # off-window poll: hourly (catches reschedules + late corrections)
    - cron: "17 0-15 * * *"
    # daily heartbeat DM — silence itself becomes detectable (PRD §8.3)
    - cron: "7 7 * * *"
  workflow_dispatch:
    inputs:
      manual_results:
        description: "Degraded-mode fallback: JSON array of operator results [{uefaMatchId, scoreA90, scoreB90, extraTime?, penalties?, advancerTeamId?}]"
        required: false
        type: string

# never overlap runs; never cancel an in-flight push (Fanbet pattern)
concurrency:
  group: oracle-bot
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install + build relayer
        working-directory: relayer
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # The season: UEFA feed → mainnet proxy. config/mainnet-map.json is
      # generated from the pushed matches.json (generate-map.mjs) — an empty
      # map is a no-op run. TELEGRAM_CHANNEL_ID (Actions var) routes the
      # public digests + T-75 reminders; unset = ops DM only.
      - name: Relay results (Chiliz mainnet)
        working-directory: relayer
        env:
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
          PREDICTOR_ADDRESS: "0x742c6963a81012bc7949F0058Fba07c8d1A80c4d"
          RPC_URL: "https://rpc.ankr.com/chiliz"
          CHAIN_ID: "88888"
          ORACLE_MIN_CHZ: "20"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPS_CHAT_ID: ${{ vars.TELEGRAM_OPS_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          EXTRA=""
          # daily 07:07 UTC schedule → heartbeat DM
          if [ "${{ github.event.schedule }}" = "7 7 * * *" ]; then EXTRA="--heartbeat"; fi
          # operator-dispatched manual results → degraded-mode fallback
          if [ -n "${{ github.event.inputs.manual_results }}" ]; then
            printf '%s' '${{ github.event.inputs.manual_results }}' > /tmp/manual-results.json
            EXTRA="$EXTRA --manual /tmp/manual-results.json"
          fi
          node scripts/relay.mjs --map config/mainnet-map.json $EXTRA

      # Oracle gas-balance watch (both chains, every run; Supabase dedupes to
      # ≤1 Telegram warning per chain per 24h). An empty oracle key fails
      # silently — this is the tripwire. Floor: 20 CHZ (ORACLE_MIN_CHZ).
      - name: Oracle balance watch — Chiliz mainnet
        if: always()
        working-directory: relayer
        env:
          RPC_URL: "https://rpc.ankr.com/chiliz"
          CHAIN_ID: "88888"
          ORACLE_ADDRESS: "0xB57Cb421E3B707d0970Ec758D40a4366DB317B15"
          OWNER_ADDRESS: "0x47103b0FC04c91Ac388eaE3c4f91D038CBfD9CF8"
          ORACLE_MIN_CHZ: "20"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPS_CHAT_ID: ${{ vars.TELEGRAM_OPS_CHAT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-balance.mjs

      # Ops sentinels: governance drift, solvency invariant, seasonal
      # deadlines (+ site uptime and the deep stage scan on mainnet). Same
      # 24h-per-type dedupe as the balance watch. EXPECTED_IMPL must be
      # updated on every legitimate proxy upgrade.
      - name: Ops sentinel — Chiliz mainnet
        if: always()
        working-directory: relayer
        env:
          RPC_URL: "https://rpc.ankr.com/chiliz"
          CHAIN_ID: "88888"
          PREDICTOR_ADDRESS: "0x742c6963a81012bc7949F0058Fba07c8d1A80c4d"
          EXPECTED_OWNER: "0x47103b0FC04c91Ac388eaE3c4f91D038CBfD9CF8"
          EXPECTED_ORACLE: "0xB57Cb421E3B707d0970Ec758D40a4366DB317B15"
          EXPECTED_IMPL: "0x09FeC2eA6f5a1EeA5171cb0ffBC65Dcf76ed72f6"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPS_CHAT_ID: ${{ vars.TELEGRAM_OPS_CHAT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          EXTRA="--uptime"
          if [ "${{ github.event.schedule }}" = "7 7 * * *" ]; then EXTRA="$EXTRA --deep"; fi
          node scripts/sentinel.mjs $EXTRA

      - name: Ops sentinel — Spicy staging
        if: always()
        working-directory: relayer
        env:
          RPC_URL: "https://spicy-rpc.chiliz.com"
          CHAIN_ID: "88882"
          PREDICTOR_ADDRESS: "0xAE32d62B71DD1f6Eb4f27fC65Facc69AcFEe83D6"
          EXPECTED_OWNER: "0x47103b0FC04c91Ac388eaE3c4f91D038CBfD9CF8"
          EXPECTED_ORACLE: "0xB57Cb421E3B707d0970Ec758D40a4366DB317B15"
          EXPECTED_IMPL: "0x888e98fC6ecEe5C8A086003956Cf7DAb7493bBd7"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPS_CHAT_ID: ${{ vars.TELEGRAM_OPS_CHAT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sentinel.mjs

      - name: Oracle balance watch — Spicy staging
        if: always()
        working-directory: relayer
        env:
          RPC_URL: "https://spicy-rpc.chiliz.com"
          CHAIN_ID: "88882"
          ORACLE_ADDRESS: "0xB57Cb421E3B707d0970Ec758D40a4366DB317B15"
          OWNER_ADDRESS: "0x47103b0FC04c91Ac388eaE3c4f91D038CBfD9CF8"
          ORACLE_MIN_CHZ: "20"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OPS_CHAT_ID: ${{ vars.TELEGRAM_OPS_CHAT_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-balance.mjs
